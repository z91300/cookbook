# Cookbook 生产编排（不使用 .env，全部变量带默认值，可用环境变量覆盖）
#   COOKBOOK_IMAGE    镜像名（默认 ghcr.io/z91300/cookbook:latest）
#   COOKBOOK_WEB_PORT  前端 SSR 宿主机端口（默认 8080 → 容器 3000）
#   COOKBOOK_API_PORT  后端 API 宿主机端口（默认 8000 → 容器 8000）
#   NPM_REGISTRY / GOPROXY  构建期依赖源（仅 docker compose build 时生效）
#
# 数据库（运行时环境变量注入，无需挂载配置文件；装配逻辑 internal/cmd/dbenv.go）：
#   DB_TYPE      postgres（默认，别名 pg/pg/postgres 均可）或 sqlite
#   postgres 模式：DB_HOST / DB_PORT(默认5432) / DB_USER(默认root) /
#                  DB_PASSWORD / DB_NAME(默认cookbook)
#   sqlite   模式：DB_DATA_PATH（默认 /data/cookbook.db，建议挂载卷持久化）
#   全部 DB_* 均可用环境变量覆盖，示例：
#     DB_TYPE=postgres DB_HOST=1.2.3.4 DB_PORT=25432 DB_USER=root \
#     DB_PASSWORD=xxx DB_NAME=cookbook docker compose up -d --wait
#
# 单容器同时运行前端 SSR（3000）与后端 API（8000），对外暴露两个端口。
# 常用命令：
#   本地起栈：docker compose up -d --wait
#   查看日志：docker compose logs -f cookbook

name: cookbook

services:
  cookbook:
    image: ${COOKBOOK_IMAGE:-ghcr.io/z91300/cookbook:latest}
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    environment:
      # 后端监听端口（容器内默认 8000；镜像内无 config.yaml，此变量兜底 server 段）
      API_PORT: ${API_PORT:-8000}
      # 数据库类型：postgres | sqlite（运行时注入，优先于镜像内任何配置文件）
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-cookbook}
      # sqlite 模式专用：库文件路径（DB_TYPE=sqlite 时生效）
      DB_DATA_PATH: ${DB_DATA_PATH:-/data/cookbook.db}
    volumes:
      # sqlite 模式数据卷（postgres 模式无副作用，目录不会被写入）
      - cookbook-db:/data
    ports:
      - "${COOKBOOK_WEB_PORT:-8080}:3000"
      - "${COOKBOOK_API_PORT:-8000}:8000"
    healthcheck:
      # 两个端口都要通（前端 SSR + 后端 /api.json）才视为健康
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:3000/ && wget -q -O /dev/null http://127.0.0.1:8000/api.json"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  cookbook-db: