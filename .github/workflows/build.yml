# GitHub Actions：构建单镜像（前端 SSR + GoFrame 后端）→ 推送 GHCR
#
# 无需配置任何仓库 Secret 即可构建推送 GHCR：推送 GHCR 使用内置 GITHUB_TOKEN
# （permissions.packages），数据库凭据运行时经 DB_* 环境变量注入，镜像与 CI 内均无凭据。
# 但「部署」一步需要 4 个 DEPLOY_* Secret，未配置时 deploy job 会失败（不会影响镜像推送）。
#
# 触发：
#   push 到 main 分支        → 构建 + 推送（tag: latest + short-sha）→ SSH 部署
#   手动 workflow_dispatch   → 可选指定版本号 tag → SSH 部署
#   push v* 标签             → tag: <版本> + latest → SSH 部署

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本 tag（如 v1.0.0）；留空仅推 latest + sha"
        required: false
        default: ""

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          TAGS="${IMAGE}:latest,${IMAGE}:${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME},${TAGS}"
          fi
          if [[ -n "${{ inputs.version }}" ]]; then
            TAGS="${IMAGE}:${{ inputs.version }},${TAGS}"
          fi
          echo "IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.TAGS }}

      # 按团队约定：推送前人工本地验证（起隔离栈跑 scripts/ci_selftest.py），
      # CI 不跑自测，构建成功即推送。
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}

  # ---------------------------------------------------------------------------
  # 部署：镜像推送成功后，SSH 到目标服务器拉取新镜像并重建容器
  #
  # 所需的仓库 Secrets（Settings → Secrets and variables → Actions）：
  #   DEPLOY_HOST     目标服务器地址（域名或 IP）
  #   DEPLOY_USER     SSH 用户（须在 docker 组内；或直接 root）
  #   DEPLOY_SSH_KEY  专用部署私钥全文（ed25519，含 BEGIN/END 两行）
  #   DEPLOY_PORT     SSH 端口（可选，默认 22）
  #
  # 前置条件（详见 docs/docker-auto-update.md「SSH 直连」一节）：
  #   1. 四个 Secret 要加到 **Repository secrets**（Settings → Secrets and variables →
  #      Actions → Secrets → Repository secrets）。只加到 Environment secrets 而不在本 job
  #      声明 environment: 的话，job 读不到，会报 drone-ssh 那句含糊的 "missing server host"；
  #   2. 服务器 /opt/zspace/docker-compose.yml 的 image 指向本仓库推送的镜像；
  #   3. 镜像为私有包时，服务器需已 `docker login ghcr.io`（PAT 具备 read:packages）。
  # 只想到发版才部署：把下面的 if 改成 startsWith(github.ref, 'refs/tags/v')
  # 注意：这里刻意不做 `docker image prune` —— 旧镜像要留着回滚。
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      # 连续推送时不并发部署，避免两次 pull/recreate 互相踩
      group: deploy-production
      cancel-in-progress: false
    steps:
      # 先确认 Secret 真的注入了：只建在 Environment secrets 里的情况，这里直接给出可执行的
      # 报错，比 drone-ssh 的 "missing server host" 清楚得多
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 $name —— 加到 Repository secrets；若想留用 Environment secrets，需在本 job 上声明 environment: <环境名>"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            # COMPOSE_FILE 指定编排文件即可，无需 cd（项目目录/项目名与"进目录再执行"一致）。
            # 只更新单个服务时在末尾加服务名，如 `... --wait --wait-timeout 300 cookbook`。
            export COMPOSE_FILE=/opt/zspace/vps/docker-compose.yaml
            if ! docker compose up -d --pull always --wait --wait-timeout 300 cookbook; then
              docker compose logs --tail 50 cookbook || true
              exit 1
            fi
